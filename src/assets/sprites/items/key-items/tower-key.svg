<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- A large octagonal bow gives the icon an unmistakable key silhouette. -->
  <rect x="5" y="1" width="6" height="10" fill="#2b201b"/>
  <rect x="3" y="2" width="10" height="8" fill="#2b201b"/>
  <rect x="2" y="4" width="12" height="4" fill="#2b201b"/>
  <rect x="5" y="2" width="6" height="8" fill="#9a5627"/>
  <rect x="4" y="3" width="8" height="6" fill="#9a5627"/>
  <rect x="3" y="5" width="10" height="2" fill="#9a5627"/>
  <rect x="5" y="3" width="5" height="1" fill="#f2c45d"/>
  <rect x="6" y="4" width="4" height="4" fill="#30231e"/>
  <rect x="7" y="5" width="3" height="2" fill="#6f4a34"/>

  <!-- Central shaft and asymmetric stepped teeth read clearly at 16 pixels. -->
  <rect x="6" y="9" width="5" height="7" fill="#2b201b"/>
  <rect x="9" y="11" width="5" height="3" fill="#2b201b"/>
  <rect x="3" y="13" width="4" height="3" fill="#2b201b"/>
  <rect x="7" y="9" width="3" height="6" fill="#d78a32"/>
  <rect x="9" y="11" width="4" height="2" fill="#d78a32"/>
  <rect x="4" y="13" width="3" height="2" fill="#d78a32"/>
  <rect x="8" y="9" width="1" height="5" fill="#f2c45d"/>
</svg>
